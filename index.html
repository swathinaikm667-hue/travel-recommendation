<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Recommendation Web App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 0 10px;
    }
    nav {
      background: #007acc;
      color: white;
      padding: 12px;
    }
    nav a {
      margin-right: 20px;
      color: white;
      text-decoration: none;
    }
    #search-box {
      margin-left: 40px;
      padding: 6px;
      width: 250px;
      border-radius: 4px;
      border: none;
      color: #333;
    }
    #search-btn, #clear-btn {
      padding: 6px 14px;
      margin-left: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #search-btn {
      background: #005a99;
      color: white;
    }
    #clear-btn {
      background: #ccc;
      color: #333;
    }
    .intro {
      padding: 20px;
    }
    .intro h1 {
      color: #222;
    }
    .intro p {
      color: #444;
    }
    .results {
      margin: 20px;
      padding: 15px;
      background: white;
      border-radius: 6px;
      min-height: 100px;
    }
    .destination {
      margin-bottom: 15px;
    }
    .destination img {
      width: 100px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact Us</a>

    <input type="text" id="search" placeholder="Search for beaches, temples, countries..."
           id="search-box">

    <button id="search-btn">Search</button>
    <button id="clear-btn">Clear</button>
  </nav>

  <!-- Introduction Section -->
  <div class="intro">
    <h1>Travel Recommendation Web Application</h1>
    <p>
      This travel recommendation web app helps you discover the best beaches, temples, 
      and countries based on your preferences.
    </p>
  </div>

  <!-- Search Results Section -->
  <div id="results" class="results">
    <p>Type 'beach', 'temple', or 'country' and click Search.</p>
  </div>

  <!-- Inline Locations Data (for Tasks 6, 7, 8) -->
  <script>
    const searchInput = document.getElementById("search");
    const searchBtn   = document.getElementById("search-btn");
    const clearBtn    = document.getElementById("clear-btn");
    const resultsDiv  = document.getElementById("results");

    const locations = [
      // Beaches
      {
        name: "Kovalam Beach",
        image: "https://images.unsplash.com/photo-1520250497591-11abc8e3c566?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
        category: "beach"
      },
      {
        name: "Marina Beach",
        image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
        category: "beach"
      },

      // Temples
      {
        name: "Brihadeeswarar Temple",
        image: "https://images.unsplash.com/photo-1580527862782-5866ace6f5ce?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
        category: "temple"
      },
      {
        name: "Meenakshi Temple",
        image: "https://images.unsplash.com/photo-1564355808508-5a6f5b38b3f1?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
        category: "temple"
      },

      // Countries
      {
        name: "France",
        image: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
        category: "country"
      },
      {
        name: "Japan",
        image: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
        category: "country"
      }
    ];

    searchBtn.addEventListener("click", () => {
      const query = searchInput.value.trim().toLowerCase();
      const matched = locations.filter(loc =>
        loc.name.toLowerCase().includes(query) ||
        loc.category.toLowerCase().includes(query)
      );

      if (matched.length > 0) {
        resultsDiv.innerHTML = matched
          .map(loc => `
            <div class="destination">
              <strong>${loc.name}</strong> (${loc.category})<br>
              <img src="${loc.image}" alt="${loc.name}">
            </div>
          `)
          .join("");
      } else {
        resultsDiv.innerHTML = "<p>No results found. Try 'beach', 'temple', or 'country'.</p>";
      }
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      resultsDiv.innerHTML = "<p>Type 'beach', 'temple', or 'country' and click Search.</p>";
    });
  </script>

</body>
</html>
