<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Recommendation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }
    nav {
      background: #007acc;
      color: white;
      padding: 12px;
    }
    nav a {
      margin-right: 20px;
      color: white;
      text-decoration: none;
    }
    #search {
      margin-left: 40px;
      padding: 6px;
      width: 250px;
      border-radius: 4px;
      border: none;
      color: #333;
    }
    #search-btn, #clear-btn {
      padding: 6px 14px;
      margin-left: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #search-btn {
      background: #005a99;
      color: white;
    }
    #clear-btn {
      background: #ccc;
      color: #333;
    }
    .intro {
      padding: 20px;
    }
    .results {
      margin: 20px;
      padding: 15px;
      background: white;
      border-radius: 6px;
    }
    .destination {
      margin-bottom: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    .destination img {
      width: 120px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <!-- Navigation bar -->
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact Us</a>

    <input type="text" id="search" placeholder="Search for beaches, temples, countries...">

    <button id="search-btn">Search</button>
    <button id="clear-btn">Clear</button>
  </nav>

  <!-- Introduction -->
  <div class="intro">
    <h1>Travel Recommendation Web Application</h1>
    <p>This app helps you discover beaches, temples, and countries based on your preferences.</p>
  </div>

  <!-- Results area -->
  <div id="results" class="results">
    <p>Type 'beach', 'temple', or 'country' and click Search.</p>
  </div>

  <script>
    const searchInput = document.getElementById("search");
    const searchBtn   = document.getElementById("search-btn");
    const clearBtn    = document.getElementById("clear-btn");
    const resultsDiv  = document.getElementById("results");

    const locations = [
      // Beach 1
      {
        name: "Kovalam Beach",
        image: "https://static.toiimg.com/thumb/107013427/Sunset-at-Kovalam-Beach.jpg?width=1200&height=900",
        category: "beach"
      },

      // Beach 2
      {
        name: "Kappad Beach",
        image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
        category: "beach"
      },

      // Temple 1
      {
        name: "Brihadeeswarar Temple",
        image: "https://upload.wikimedia.org/wikipedia/commons/6/60/Madurai_Meenakshi_temple_shikhara.jpg",
        category: "temple"
      },

      // Temple 2
      {
        name: "Meenakshi Temple",
        image: "https://upload.wikimedia.org/wikipedia/commons/6/65/India_Meenakshi_Temple.jpg",
        category: "temple"
      },

      // Country 1
      {
        name: "France",
        image: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
        category: "country"
      },

      // Country 2
      {
        name: "Japan",
        image: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
        category: "country"
      }
    ];

    searchBtn.addEventListener("click", () => {
      const query = searchInput.value.trim().toLowerCase();

      if (!query) {
        resultsDiv.innerHTML = "<p>Please type 'beach', 'temple', or 'country'.</p>";
        return;
      }

      const matched = locations.filter(loc =>
        loc.name.toLowerCase().includes(query) ||
        loc.category.toLowerCase().includes(query)
      );

      if (matched.length > 0) {
        resultsDiv.innerHTML = matched
          .map(loc => `
            <div class="destination">
              <strong>${loc.name}</strong> (${loc.category})<br>
              <img src="${loc.image}" alt="${loc.name}">
            </div>
          `)
          .join("");
      } else {
        resultsDiv.innerHTML = "<p>No results found. Try 'beach', 'temple', or 'country'.</p>";
      }
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      resultsDiv.innerHTML = "<p>Type 'beach', 'temple', or 'country' and click Search.</p>";
    });
  </script>

</body>
</html>
